services:
  # ─── 基础设施 ───────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ─── 后端 ──────────────────────────────────────────────
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "scripts/prestart.sh &&
             gunicorn app.main:app
               --worker-class uvicorn.workers.UvicornWorker
               --workers 2
               --bind 0.0.0.0:8000
               --timeout 120
               --graceful-timeout 30
               --access-logfile -"
    ports:
      - "8000:8000"
    restart: unless-stopped

  celery_worker:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks.celery_app.celery_app worker
        -Q indexing,scoring
        --loglevel=INFO
        --concurrency=2
        --max-tasks-per-child=200
    restart: unless-stopped

  celery_beat:
    build: ./backend
    env_file: .env
    depends_on:
      - celery_worker
    command: >
      celery -A app.tasks.celery_app.celery_app beat
        --loglevel=INFO
    restart: unless-stopped

  # ─── 前端 ──────────────────────────────────────────────
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

  # ─── 网关 ──────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
